<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); font-weight: 800; }

      /* Farben laut PLAYBOOK.md */
      :root {
        --box: rgba(28, 26, 24, 0.88);
        --amber: rgb(242, 163, 58);
        --white: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1c1a18; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }

      .scene { position: absolute; inset: 0; overflow: hidden; }
      video.scene { width: 100%; height: 100%; object-fit: cover; }
      .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

      /* Text im oberen Drittel (y ca. 430 px), mittig, nie unten rechts */
      .caption { position: absolute; left: 60px; right: 60px; top: 430px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .box { display: block; padding: 12px 26px 16px; border-radius: 18px; background: var(--box); color: var(--white); font-weight: 800; line-height: 1.12; text-align: center; }
      .box.accent { color: var(--amber); }

      .end-dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); }
      .end-card { position: absolute; left: 60px; right: 60px; top: 560px; display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--white); font-weight: 800; }
      .end-brand { font-size: 110px; color: var(--amber); line-height: 1.1; }
      .end-sub { font-size: 92px; line-height: 1.15; }
      .end-lines { margin-top: 60px; font-size: 56px; line-height: 1.3; }
      .end-url { margin-top: 60px; font-size: 62px; color: var(--amber); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      {{SCENES}}
      {{CAPTIONS}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{TWEENS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
